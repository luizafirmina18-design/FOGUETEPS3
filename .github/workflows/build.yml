name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps3dev/psl1ght:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG
        run: |
          export PSL1GHT=/psl1ght
          export PATH=$PSL1GHT/host/bin:$PATH
          export PORTLIBS=/psl1ght/portlibs
          make clean
          make pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: SpaceflightSimulator-PS3
          path: |
            *.pkg
            *.self